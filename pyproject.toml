[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordfisher"
version = "1.0.0"
description = "Ordinal Power and Fisher spectra on adjacent-rank Cayley graphs"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["ordinal patterns", "permutation entropy", "Fisher information", "graph spectra", "Cayley graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
authors = [
    {name = "Giovanni Campanini"},
    {name = "Fernando Pose"},
    {name = "Carlos Garcia"},
    {name = "Francisco O. Redelico"},
]
maintainers = [{name = "Francisco O. Redelico"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "networkx>=3.0",
]

[project.urls]
Repository = "https://github.com/FranciscoX78/ordfisher"
Issues = "https://github.com/FranciscoX78/ordfisher/issues"

[project.optional-dependencies]
ordpy = ["ordpy>=1.0"]
fast = ["numba>=0.58"]
rebuild = ["sympy>=1.10"]
test = ["pytest>=7.0", "Pillow>=9.0"]
all = ["ordpy>=1.0", "numba>=0.58", "sympy>=1.10", "pytest>=7.0", "Pillow>=9.0"]

[tool.setuptools.packages.find]
include = ["ordfisher*"]

[tool.setuptools.package-data]
ordfisher = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
